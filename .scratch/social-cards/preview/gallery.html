<script>
  const KEYS = [{"key":"A","name":"Device","bet":"The Poster reads as a screen in motion"},{"key":"B","name":"Bleed","bet":"The Poster is the card; text rides on a scrim"},{"key":"C","name":"Stage","bet":"The Poster is a specimen, caption beneath"},{"key":"D","name":"Split","bet":"Caption leads, Poster is evidence, never cropped"},{"key":"E","name":"Poster-first","bet":"One line of type is enough"}];
  let i = Math.max(0, KEYS.findIndex(k => k.key === new URLSearchParams(location.search).get('variant')));
  function go(d){ i = (i + d + KEYS.length) % KEYS.length; set(); }
  function set(){
    const k = KEYS[i];
    const u = new URL(location.href); u.searchParams.set('variant', k.key);
    history.replaceState(null,'',u);
    document.querySelectorAll('figure').forEach(f => {
      f.style.display = f.dataset.v === k.key ? '' : 'none';
    });
    document.getElementById('now').innerHTML = '<i>'+k.key+' · '+k.name+'</i><br><span class="sub2">'+k.bet+'</span>';
  }
  addEventListener('keydown', e => {
    if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
  });
  set();
</script>
