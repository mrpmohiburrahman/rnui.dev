name: Codex Triage

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    # Skip when OPENAI_API_KEY is not configured (e.g. fork PRs, or repo
    # admins haven't set the secret yet). Avoids noisy red checks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check OPENAI_API_KEY presence
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY not set; skipping Codex review."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.keycheck.outputs.has_key == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        if: steps.keycheck.outputs.has_key == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v6
        if: steps.keycheck.outputs.has_key == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: steps.keycheck.outputs.has_key == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Codex review
        if: steps.keycheck.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pnpm codex:review-pr
