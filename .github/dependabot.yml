version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      radix:
        patterns:
          - "@radix-ui/*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
